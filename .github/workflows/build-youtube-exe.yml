name: 유튜브 다운로더 EXE 만들기

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -U yt-dlp pyinstaller
      - run: pyinstaller --onefile --noconsole --name "유튜브다운로더" youtube-downloader/gui.py
      - uses: actions/upload-artifact@v4
        with:
          name: 유튜브다운로더
          path: dist/유튜브다운로더.exe
